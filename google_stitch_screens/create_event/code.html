<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-surface": "#0b0f0f",
              "primary-container": "#9df197",
              "on-primary-fixed-variant": "#12661e",
              "tertiary-dim": "#545622",
              "primary-dim": "#096119",
              "outline": "#757c7b",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed": "#d6e8ce",
              "surface-dim": "#d4dbda",
              "on-secondary-fixed": "#344331",
              "error-container": "#fd795a",
              "tertiary": "#60622d",
              "secondary": "#53634f",
              "on-tertiary-fixed": "#4d501d",
              "on-primary-container": "#005c15",
              "on-tertiary-fixed-variant": "#6a6d37",
              "surface": "#f8faf9",
              "background": "#f8faf9",
              "on-error-container": "#6e1400",
              "on-primary": "#eaffe2",
              "surface-bright": "#f8faf9",
              "on-secondary-container": "#465643",
              "inverse-on-surface": "#9b9d9d",
              "primary": "#1c6d25",
              "outline-variant": "#acb3b2",
              "tertiary-fixed-dim": "#edefac",
              "on-primary-fixed": "#00460e",
              "on-surface-variant": "#596060",
              "surface-container": "#eaefee",
              "error": "#a73b21",
              "tertiary-container": "#fcfeb9",
              "on-surface": "#2d3433",
              "secondary-fixed-dim": "#c7dac1",
              "on-tertiary-container": "#60622d",
              "primary-fixed": "#9df197",
              "inverse-primary": "#9df197",
              "surface-tint": "#1c6d25",
              "on-tertiary": "#fcfdb9",
              "surface-container-highest": "#dde4e3",
              "error-dim": "#791903",
              "surface-variant": "#dde4e3",
              "surface-container-low": "#f1f4f3",
              "on-error": "#fff7f6",
              "primary-fixed-dim": "#90e28a",
              "on-secondary-fixed-variant": "#50604c",
              "on-secondary": "#ecfee4",
              "on-background": "#2d3433",
              "tertiary-fixed": "#fcfeb9",
              "secondary-dim": "#475744",
              "secondary-container": "#d6e8ce",
              "surface-container-high": "#e4e9e8"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#f8faf9]/80 backdrop-blur-xl shadow-[0_8px_32px_-4px_rgba(45,52,51,0.06)] h-16 flex items-center justify-between px-6">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#f1f4f3] transition-colors active:scale-95 duration-200 text-[#1c6d25]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-[#1c6d25]">Create Event</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full flex flex-col">
<!-- Form Section -->
<div class="space-y-8 flex-grow">
<!-- Date Picker Field -->
<div class="space-y-3">
<label class="text-on-surface-variant font-medium text-sm ml-4">When did it happen? (Includes time)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full bg-surface-container-high border-none rounded-md py-5 pl-14 pr-6 text-on-surface placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary-container focus:bg-primary-container/20 transition-all duration-300" placeholder="Today, 10:30 AM" type="text" value="Today, 10:30 AM"/>
</div>
</div>
<!-- Memory Input Field -->
<div class="space-y-3">
<label class="text-on-surface-variant font-medium text-sm ml-4">What's the memory?</label>
<textarea class="w-full bg-surface-container-high border-none rounded-lg p-6 text-on-surface placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary-container focus:bg-primary-container/20 transition-all duration-300 resize-none" placeholder="Enter memory..." rows="6"></textarea>
</div>
</div>
<!-- Relocated Image Section and Action Icons -->
<div class="mt-8 space-y-8">
<!-- Hero Visual Section (Relocated from top) -->
<div class="relative">
<div class="w-full aspect-[16/10] rounded-xl overflow-hidden shadow-[0_8px_48px_-4px_rgba(45,52,51,0.06)]">
<img alt="Lush green botanical garden" class="w-full h-full object-cover" data-alt="Dreamy close-up of vibrant green ferns and moss in a sun-drenched botanical conservatory with soft natural lighting and organic textures" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBJNiR9vI3OICxFWUUcPVX9NR9obdNnWTzcx9qQlF3TPmxBm7l1YfdYjJ5Pc_Bbrjelifxi8D0k7FX8oSnujfdJ2o81Urg4bjHSLt08vyO296B9Y89uv23dd_K4wQUuDZMLga8Y7J_GkCEADh2P9btSSnCE3l5mdGC3y0BuzSPLY21ST7MPA9wEzQevvG_lW85bBr17M4yabBzyjv3lDOGPSynA17hZez505HC5zxf7EvOx9raYSYbWa0arYl0pkPzPlYawL7ehwFf"/>
</div>
<!-- Floating Decorative Element -->
<div class="absolute -bottom-6 -right-2 bg-primary-container p-4 shadow-xl rounded-full">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
<!-- Selection Icons -->
<div class="flex items-center gap-4 px-2 pt-4">
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-primary hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined" data-icon="add_photo_alternate">add_photo_alternate</span>
</button>
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-primary hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-primary hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-surface/80 backdrop-blur-md z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full py-4 bg-gradient-to-br from-[#1c6d25] to-[#096119] text-[#eaffe2] font-bold text-lg rounded-full shadow-[0_8px_32px_-4px_rgba(28,109,37,0.3)] active:scale-[0.98] transition-all duration-200">
                Next
            </button>
</div>
</div>
<!-- Hidden Bottom Nav Suppression for Transactional Task (as per mandate) -->
<!-- The BottomNavBar is intentionally excluded because this is a task-focused sub-page -->
</body></html>
